<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Anielle Ferrari</title>
  <link rel="icon" type="image/png" href="microscope_1860786.png">

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lota:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#ffffff;
      --menu-bg:#18BC9C;
      --accent:#18BC9C;
      --muted:#8b949e;
      --text:#0b0f1a;
      --glass: rgba(255,255,255,0.03);
    }

    *{box-sizing:border-box; margin:0; padding:0;}
    html, body {
      height:100%;
      font-family: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    a:hover { color: #0f7767; }

    header{
      position:fixed;
      left:0; right:0; top:0;
      height:64px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--menu-bg);
      z-index:30;
    }

    .nav{
      width:100%;
      max-width:1100px;
      padding:0 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .brand {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      color: #052A24;
    }

    .menu{
      display:flex;
      gap:18px;
      align-items:center;
    }

    .menu a{
      font-weight:600;
      font-size:0.95rem;
      color: #052A24;
    }
    .menu a:hover{ color: #ffffff; }
    .menu a.active{ color: #ffffff; border-bottom: 2px solid #ffffff; }

    main{
      max-width:900px;
      margin:110px auto 60px;
      padding:24px;
      text-align:center;
    }

    h1 {
      font-family: 'Lota', sans-serif;
      font-weight: 700;
      color:#052A24;
      font-size: 1.8rem;
      margin-bottom: 24px;
      border-bottom: 2px solid rgba(0,0,0,0.05);
      padding-bottom: 8px;
    }

    .socials {
      margin-top:32px;
    }

    .social-row {
      display: flex;
      flex-wrap: wrap; /* quebra se não couber na tela */
      justify-content: center;
      gap: 12px;
    }

    .social-row a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:40px; height:40px;
      border-radius:10px;
      background:var(--glass);
      border:1px solid rgba(0,0,0,0.05);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .social-row a:hover{
      transform: scale(1.1);
      background: rgba(24, 188, 156, 0.1);
    }
    .social-row img{
      width:22px; height:22px;
      object-fit:contain;
    }

    .cv-btn{
      display:inline-block;
      margin-top:24px;
      padding:10px 18px;
      border-radius:10px;
      background:linear-gradient(180deg, rgba(24,188,156,0.12), rgba(24,188,156,0.12));
      border:1px solid rgba(42,143,124,0.22);
      color:#052A24;
      font-weight:700;
      text-decoration: none;
    }

    footer{
      max-width:1100px;
      margin:32px auto;
      color:var(--muted);
      text-align:center;
      font-size:0.9rem;
    }

    @media (max-width:480px){
      .social-row a{
        width:36px;
        height:36px;
      }
      .social-row img{
        width:18px;
        height:18px;
      }
      .cv-btn{padding:8px 14px;}
    }
  </style>
</head>

<body>
  <header>
    <nav class="nav">
      <div class="brand">Anielle Ferrari</div>
      <div class="menu">
        <a href="index.html">Home</a>
        <a href="publications.html">Publications</a>
        <a href="contact.html" class="active">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Contact Me</h1>

    <div class="socials">
      <div class="social-row">
        <a href="mailto:anielle.ferrari@usp.br"><img src="icons/email.png" alt="Email"></a>
        <a href="https://orcid.org/0000-0001-7072-4846" target="_blank"><img src="icons/orcid.png" alt="ORCID"></a>
        <a href="https://scholar.google.com/citations?user=24JtB7UAAAAJ&hl=en" target="_blank"><img src="icons/scholar.png" alt="Google Scholar"></a>
        <a href="https://www.researchgate.net/profile/Anielle-Ferrari" target="_blank"><img src="icons/researchgate.png" alt="ResearchGate"></a>
        <a href="https://www.linkedin.com/in/anielle-ferrari-5a15bb127/" target="_blank"><img src="icons/linkedin.png" alt="LinkedIn"></a>
        <a href="https://github.com/anielleferrari" target="_blank"><img src="icons/github.png" alt="GitHub"></a>
        <a href="https://bsky.app/profile/anielleferrari.bsky.social" target="_blank"><img src="icons/bluesky.png" alt="BlueSky"></a>
        <a href="http://lattes.cnpq.br/3091634675002248" target="_blank"><img src="icons/lattes.png" alt="Currículo Lattes"></a>
      </div>
    </div>

    <a class="cv-btn" href="#" download>Download CV</a>
  </main>

  <footer>
    <p>Thank you for visiting my contact page.</p>
    <p>♥ Made by Anielle Ferrari, using HTML 5 and CSS. ♥</p>
  </footer>
</body>
</html>
